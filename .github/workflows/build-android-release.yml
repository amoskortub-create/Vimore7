name: Build signed Android releases

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        working-directory: artifacts/vimore
        run: pnpm exec next build

      - name: Sync Capacitor
        working-directory: artifacts/vimore
        run: pnpm exec cap sync android

      - name: Prepare Android assets
        working-directory: artifacts/vimore
        run: pnpm run android:prepare-assets

      - name: Configure release signing
        working-directory: artifacts/vimore/android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEYSTORE_BASE64" ]]; then
            echo "Missing GitHub Actions secret: RELEASE_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Build signed APK and AAB
        working-directory: artifacts/vimore/android
        run: ./gradlew --no-daemon clean assembleRelease bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK signature
        working-directory: artifacts/vimore/android
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Verify AAB signature
        working-directory: artifacts/vimore/android
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab
          unzip -Z1 app/build/outputs/bundle/release/app-release.aab | grep -E '^META-INF/[^/]+\.(RSA|DSA|EC)$'

      - name: Upload signed APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: vimore-signed-android-release
          path: |
            artifacts/vimore/android/app/build/outputs/apk/release/app-release.apk
            artifacts/vimore/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
