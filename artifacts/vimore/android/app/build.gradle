apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('signing.properties')
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def signingValue = { String environmentName, String propertyName ->
    System.getenv(environmentName) ?: signingProperties.getProperty(propertyName)
}
def signingStorePath = signingProperties.getProperty('storeFile') ?: 'app/release.keystore'
def signingStorePassword = signingValue('KEYSTORE_PASSWORD', 'storePassword')
def signingKeyAlias = signingValue('KEY_ALIAS', 'keyAlias')
def signingKeyPassword = signingValue('KEY_PASSWORD', 'keyPassword')

android {
    namespace "cfd.mediatech.vimore"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "cfd.mediatech.vimore"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.0.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    
    signingConfigs {
        release {
            storeFile rootProject.file(signingStorePath)
            storePassword signingStorePassword
            keyAlias signingKeyAlias
            keyPassword signingKeyPassword
        }
    }
    
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

def releaseBuildRequested = gradle.startParameter.taskNames.any { taskName ->
    def normalizedTaskName = taskName.toLowerCase()
    normalizedTaskName.contains('release') || normalizedTaskName in ['assemble', 'build']
}

if (releaseBuildRequested) {
    def missingSigningConfig = []
    if (!rootProject.file(signingStorePath).isFile()) {
        missingSigningConfig.add("android/${signingStorePath}")
    }
    [
        'KEYSTORE_PASSWORD': signingStorePassword,
        'KEY_ALIAS': signingKeyAlias,
        'KEY_PASSWORD': signingKeyPassword
    ].each { variable, value ->
        if (!value) {
            missingSigningConfig.add(variable)
        }
    }
    if (!missingSigningConfig.isEmpty()) {
        throw new GradleException(
            "Cannot build a signed Android release. Missing: ${missingSigningConfig.join(', ')}"
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-messaging'
}

apply from: 'capacitor.build.gradle'
